name: PulseWatch Monitor

# The "always-awake" worker — runs on GitHub's free tier (public repo: no
# Actions-minute cost). Each run: connect to Neon, probe all due monitors,
# save checks, fire alerts. No paid server required.
#
# Cadence and the Neon free tier: Neon scales a compute to zero after 5
# minutes of inactivity, and the Free plan bills 100 CU-hours/project/month.
# A */5 cron re-woke the compute at exactly the suspend threshold, so it never
# slept and burned the whole quota (425h active in one month). At */15 each
# tick wakes the DB for ~30s and it sleeps in between — a few CU-hours/month.
# Trade-off: outage detection latency is up to the cron interval.
on:
  schedule:
    # UTC cron. GitHub may delay scheduled runs under load.
    - cron: "*/15 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run one monitoring tick
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-worker-default-secret-key-1234567890' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[notice] DATABASE_URL secret is not configured in GitHub repository secrets."
            echo "[notice] Skipping monitoring tick without failing the workflow run."
            exit 0
          fi
          python backend/worker_runner.py
